<html lang="en">
<head>

  <style>
    :root {
      --primary: #0d9488;          /* Teal */
      --secondary: #1e3a8a;        /* Deep Navy Blue */
      --accent: #10b981;           /* Emerald Green */
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.08);
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 36px;
      color: var(--secondary);
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Presentation Deck Shell */
    .deck-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      margin-bottom: 60px;
    }

    /* Interactive Slide Visual Preview */
    .slide-viewer {
      background: #0f172a;
      color: white;
      border-radius: var(--radius);
      padding: 60px;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.3);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: var(--transition);
    }

    .slide-viewer::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(13,148,136,0.1) 0%, rgba(30,58,138,0.15) 50%, rgba(0,0,0,0) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 20px;
    }

    .slide-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slide-logo span {
      color: var(--accent);
    }

    .slide-num {
      background: rgba(255, 255, 255, 0.15);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
    }

    .slide-body {
      z-index: 2;
      margin: 40px 0;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide-title {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 24px;
      line-height: 1.25;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slide-content-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }

    @media (min-width: 768px) {
      .slide-content-layout.two-cols {
        grid-template-columns: 1fr 1fr;
      }
    }

    .slide-text-content {
      font-size: 16px;
      color: #e2e8f0;
    }

    .slide-bullets {
      list-style: none;
    }

    .slide-bullets li {
      position: relative;
      padding-left: 28px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .slide-bullets li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: 800;
      font-size: 18px;
    }

    .slide-visual-mockup {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 200px;
    }

    .slide-visual-mockup h4 {
      font-family: 'Outfit', sans-serif;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 16px 30px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .control-btn {
      background: var(--secondary);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
    }

    .control-btn:hover {
      background: var(--primary);
    }

    .control-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    /* Metadata Panel below slide */
    .metadata-panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .meta-section {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .meta-section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .meta-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      color: var(--secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meta-body {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .speaker-notes-content {
      background: #f1f5f9;
      padding: 18px;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      font-style: italic;
    }

    /* Summary / Guidelines Section */
    .guidelines-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-top: 40px;
    }

    .guidelines-card h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      color: var(--secondary);
      margin-bottom: 20px;
    }

    .guidelines-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }

    @media (min-width: 768px) {
      .guidelines-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .guide-box h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .guide-box ul {
      list-style-type: square;
      padding-left: 20px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .guide-box ul li {
      margin-bottom: 8px;
    }

    .highlight-badge {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>

  function updateSlide() {
    const slide = slidesData[currentIdx];
    
    // Update Slide Viewer Content
    const viewer = document.getElementById('slide-viewer');
    viewer.innerHTML = `
      <div class="slide-header">
        <div class="slide-logo">💊 MedRx <span>OS</span></div>
        <div class="slide-num">SLIDE ${currentIdx + 1} OF ${slidesData.length}</div>

      </div>
      <div class="slide-footer">
        <div>B2B Pitch Platform</div>
        <div>CONFIDENTIAL - FOR INTERNAL PHARMACY REVIEW ONLY</div>
      </div>
    `;



    // Update Counter
    document.getElementById('slide-counter').innerText = `Slide ${currentIdx + 1} of ${slidesData.length}`;

    // Update Buttons State
    document.getElementById('prev-btn').disabled = currentIdx === 0;
    document.getElementById('next-btn').disabled = currentIdx === slidesData.length - 1;
  }

  function nextSlide() {
    if (currentIdx < slidesData.length - 1) {
      currentIdx++;
      updateSlide();
    }
  }

  function prevSlide() {
    if (currentIdx > 0) {
      currentIdx--;
      updateSlide();
    }
  }

  // Initialize
  updateSlide();
